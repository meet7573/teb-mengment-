name: Build Student APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/student-apk
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install project dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --include=dev --no-audit --no-fund
          test -x node_modules/.bin/capacitor
          test -x node_modules/.bin/cap
          node_modules/.bin/capacitor --version

      - name: Verify Student entry
        shell: bash
        run: |
          set -euo pipefail
          test -s index.student.html
          test -s src/student/main.tsx
          test -s src/student/student.css
          test -s capacitor.config.ts

      - name: Prepare Student entry
        shell: bash
        run: |
          set -euo pipefail
          cp index.student.html index.html

      - name: Build Student web bundle
        env:
          VITE_API_BASE_URL: https://teb-mengment.onrender.com
        shell: bash
        run: ./node_modules/.bin/vite build

      - name: Verify web bundle
        shell: bash
        run: test -s dist/index.html

      - name: Add Android platform
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android
          # Use npx to invoke Capacitor CLI directly to avoid any wrapper passing unsupported flags like --verbose
          npx --yes @capacitor/cli@7.4.3 add android

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f android/gradlew
          test -f android/app/build.gradle
          test -f android/settings.gradle

      - name: Sync Capacitor
        shell: bash
        run: |
          set -euo pipefail
          # Invoke Capacitor CLI via npx to avoid unknown option errors
          npx --yes @capacitor/cli@7.4.3 sync android

      - name: Build Student debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        shell: bash
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Student APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: teb-student-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest Student APK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view student-apk-latest >/dev/null 2>&1; then
            gh release create student-apk-latest \
              --title "TEB Student APK" \
              --notes "Latest Student Tablet APK for TEB Management." \
              --target "$GITHUB_SHA"
          fi
          gh release upload student-apk-latest \
            android/app/build/outputs/apk/debug/app-debug.apk#teb-student.apk \
            --clobber

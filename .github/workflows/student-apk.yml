name: Build Student APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/student-apk

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Student entry
        shell: bash
        run: |
          set -euo pipefail
          test -s index.student.html
          test -s src/student/main.tsx
          test -s src/student/student.css
          test -s capacitor.config.ts

      - name: Prepare Student entry
        shell: bash
        run: |
          set -euo pipefail
          cp index.student.html index.html

      - name: Build Student web bundle
        env:
          VITE_API_BASE_URL: https://teb-mengment.onrender.com
        run: npx vite build

      - name: Verify web bundle
        shell: bash
        run: test -s dist/index.html

      - name: Add Android platform
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android
          npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Student debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        shell: bash
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Student APK
        uses: actions/upload-artifact@v4
        with:
          name: teb-student-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

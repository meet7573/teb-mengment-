name: Build Student APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/student-apk
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund

      - name: Check project
        shell: bash
        run: |
          set -euo pipefail
          test -s index.student.html
          test -s src/student/main.tsx
          test -s src/student/student.css
          test -s capacitor.config.ts
          ./node_modules/.bin/capacitor --version
          ./node_modules/.bin/vite --version

      - name: Prepare Student app
        run: cp index.student.html index.html

      - name: Build Student web app
        env:
          VITE_API_BASE_URL: https://teb-mengment.onrender.com
        run: ./node_modules/.bin/vite build

      - name: Add Android platform
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android
          ./node_modules/.bin/capacitor add android

      - name: Sync Android
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/capacitor sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: teb-student-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view student-apk-latest >/dev/null 2>&1; then
            gh release upload student-apk-latest \
              android/app/build/outputs/apk/debug/app-debug.apk#teb-student.apk \
              --clobber
          else
            gh release create student-apk-latest \
              android/app/build/outputs/apk/debug/app-debug.apk#teb-student.apk \
              --title "TEB Student APK" \
              --notes "Latest Student Tablet APK for TEB Management." \
              --target "$GITHUB_SHA"
          fi

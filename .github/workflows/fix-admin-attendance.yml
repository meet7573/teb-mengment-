name: Fix Admin Attendance IN OUT Persistence

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[attendance-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch attendance handlers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/components/Attendance/DigitalAttendance.tsx')
          text = path.read_text()

          old_helper = """  const handleCheckIn = (studentId: string) => {\n"""
          helper = """  const persistAttendanceDetails = (details: AttendanceDetail[]) => {\n    const updatedRecord: DailyAttendanceRecord = {\n      ...currentRecord,\n      details,\n      submittedBy: 'System User',\n      submittedAt: `${new Date().toISOString().slice(0, 10)} ${new Date().toLocaleTimeString()}`,\n    };\n    const exists = attendanceRecords.some((r) => r.date === selectedDate);\n    const updatedList = exists\n      ? attendanceRecords.map((r) => (r.date === selectedDate ? updatedRecord : r))\n      : [updatedRecord, ...attendanceRecords];\n    onSaveAttendanceRecords(updatedList);\n  };\n\n  const handleCheckIn = (studentId: string) => {\n"""
          if 'const persistAttendanceDetails = ' not in text:
              if old_helper not in text:
                  raise SystemExit('handleCheckIn marker not found')
              text = text.replace(old_helper, helper, 1)

          old_in = """  const handleCheckIn = (studentId: string) => {\n    if (currentRecord.isLocked) return;\n    const timeNow = getCurrentTime12h();\n    const updated = activeDetails.map((d) => {\n      if (d.studentId === studentId) {\n        return {\n          ...d,\n          status: 'Checked In' as AttendanceStatus,\n          checkInTime: d.checkInTime || timeNow,\n          cancellationExpiry: d.cancellationExpiry || calculateCancellationExpiry(),\n          markedAt: new Date().toLocaleTimeString(),\n        };\n      }\n      return d;\n    });\n    setActiveDetails(updated);\n  };\n"""
          new_in = """  const handleCheckIn = (studentId: string) => {\n    if (currentRecord.isLocked) return;\n    const timeNow = getCurrentTime12h();\n    const updated = activeDetails.map((d) => {\n      if (d.studentId === studentId) {\n        return {\n          ...d,\n          status: 'Checked In' as AttendanceStatus,\n          checkInTime: d.checkInTime || timeNow,\n          cancellationExpiry: d.cancellationExpiry || calculateCancellationExpiry(),\n          checkOutTime: undefined,\n          totalDuration: calculateDuration(d.checkInTime || timeNow, undefined, selectedDate),\n          markedAt: new Date().toLocaleTimeString(),\n        };\n      }\n      return d;\n    });\n    setActiveDetails(updated);\n    persistAttendanceDetails(updated);\n  };\n"""
          if old_in not in text:
              raise SystemExit('check-in handler pattern not found')
          text = text.replace(old_in, new_in, 1)

          old_out = """  const handleCheckOut = (studentId: string) => {\n    if (currentRecord.isLocked) return;\n    const timeNow = getCurrentTime12h();\n    const updated = activeDetails.map((d) => {\n      if (d.studentId === studentId) {\n        return {\n          ...d,\n          status: 'Checked Out' as AttendanceStatus,\n          checkOutTime: timeNow,\n          totalDuration: calculateDuration(d.checkInTime, timeNow, selectedDate),\n          markedAt: new Date().toLocaleTimeString(),\n        };\n      }\n      return d;\n    });\n    setActiveDetails(updated);\n  };\n"""
          new_out = """  const handleCheckOut = (studentId: string) => {\n    if (currentRecord.isLocked) return;\n    const timeNow = getCurrentTime12h();\n    const updated = activeDetails.map((d) => {\n      if (d.studentId === studentId) {\n        return {\n          ...d,\n          status: 'Checked Out' as AttendanceStatus,\n          checkOutTime: timeNow,\n          totalDuration: calculateDuration(d.checkInTime, timeNow, selectedDate),\n          markedAt: new Date().toLocaleTimeString(),\n        };\n      }\n      return d;\n    });\n    setActiveDetails(updated);\n    persistAttendanceDetails(updated);\n  };\n"""
          if old_out not in text:
              raise SystemExit('check-out handler pattern not found')
          text = text.replace(old_out, new_out, 1)

          path.write_text(text)
          PY

      - name: Commit attendance fix and remove temporary workflow
        run: |
          rm -f .github/workflows/fix-admin-attendance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Attendance/DigitalAttendance.tsx .github/workflows/fix-admin-attendance.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: persist admin attendance IN OUT actions [attendance-fix]"
          git push
